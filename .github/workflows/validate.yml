name: Validate PixelPlay
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check engine.js
          node --check app.js
      - name: Test game logic
        run: node --test tests/engine.test.cjs
